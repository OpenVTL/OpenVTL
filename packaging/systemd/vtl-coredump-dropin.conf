# Install as BOTH:
#   /etc/systemd/system/vtltape@.service.d/openvtl-coredump.conf
#   /etc/systemd/system/vtllibrary@.service.d/openvtl-coredump.conf
# Keep the coredump trap armed permanently: it costs nothing at rest and
# it is how the v0.6 vtltape pair-crash was root-caused (cores decoded to
# the uninitialized log-page description printf — mhVTL Patch 10).
# systemd-coredump (installed by install.sh) catches and stores the core.
[Service]
LimitCORE=infinity
